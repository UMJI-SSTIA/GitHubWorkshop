site_name: "GitHub Workshop"
site_description: "A Workshop about GitHub held by SSTIA"
site_author: "UMJI-SSTIA"
site_url: "https://UMJI-SSTIA.github.io/GitHubWorkshop/"
repo_url: "https://github.com/UMJI-SSTIA/GitHubWorkshop"
repo_name: GitHubWorkshop

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  custom_dir: docs/overrides

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - docs/scripts/hooks.py

extra:
  alternate:
    - name: English
      link: .
      lang: en
    - name: 简体中文
      link: zh/
      lang: zh

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

plugins:
  - search
  - mkdocs-video
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Overview: 概述
            A brief introduction of GitHub: GitHub简介
            The usage of GitHub Repository: 仓库管理
            Miscellaneous: 杂项

  - minify:
      minify_html: true

nav:
  - Home: index.md

  - A brief introduction of GitHub:
      - Overview: github-introduction/index.md
      - github-introduction/what-is-github.md
      - github-introduction/open-source-platforms.md
      - github-introduction/register-account.md
      - github-introduction/searching-on-github.md
      - github-introduction/repository-status.md
      - github-introduction/download-code.md
      - github-introduction/useful-repositories.md
  - The usage of GitHub Repository:
      - Overview: repo-management/index.md
      - repo-management/create-repository.md
      - repo-management/license.md
      - repo-management/issues.md
      - repo-management/fork.md
      - repo-management/contribute.md
      - repo-management/edit-online.md
      - repo-management/readme.md
      - repo-management/github-pages.md
  - Miscellaneous:
      - miscellaneous/documents.md
      - miscellaneous/fancy-videos.md
